# =============================================================================
# temp_converter_server 파라미터 설정 파일
# =============================================================================
# 사용법:
#   ros2 run temp_converter temp_converter_server \
#       --ros-args --params-file path/to/server_params.yaml
# =============================================================================

temp_converter_server:
  ros__parameters:

    # 변환 결과 소수점 자리수 (1~6)
    # 서버가 응답할 때 변환된 온도 값을 이 자리수로 반올림합니다.
    # 실행 중 ros2 param set /temp_converter_server decimal_places <값> 으로 변경 가능합니다.
    decimal_places: 2

    # 서비스 토픽 이름 (read_only - 실행 중 변경 불가)
    # 클라이언트의 서비스 연결 주소와 반드시 일치해야 합니다.
    service_name: "convert_temperature"
